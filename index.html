<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>危険予知（KY）活動表</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: "Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
    background:#f2f4f7;
    margin:0;
    padding:0;
    color:#222;
  }
  .wrap { max-width:480px; margin:0 auto; padding:14px; }
  h1 { font-size:19px; text-align:center; margin:10px 0 4px; color:#1a3c6e; }
  .sub { text-align:center; font-size:12px; color:#666; margin-bottom:6px; }
  .save-indicator {
    text-align:center; font-size:11px; color:#2e7d32; min-height:16px; margin-bottom:10px;
  }
  .save-indicator.saving { color:#999; }

  .screen { display:none; }
  .screen.active { display:block; }

  /* ---------- HOME ---------- */
  .home-card {
    background:#fff; border-radius:12px; padding:16px;
    margin-bottom:14px; box-shadow:0 1px 4px rgba(0,0,0,0.08);
  }
  .home-card h2 {
    font-size:13px; margin:0 0 10px; color:#1a3c6e;
    border-left:4px solid #1a3c6e; padding-left:8px;
  }
  .big-btn {
    display:block; width:100%; padding:16px; margin-top:4px;
    background:#1a3c6e; color:#fff; border:none; border-radius:10px;
    font-size:16px; font-weight:bold; cursor:pointer;
  }
  .sub-btn {
    display:block; width:100%; padding:12px; margin-top:8px;
    background:#eef1f5; color:#1a3c6e; border:none; border-radius:8px;
    font-size:14px; font-weight:bold; cursor:pointer;
  }
  .draft-line { font-size:13px; color:#444; margin-bottom:8px; }
  .draft-line b { color:#1a3c6e; }
  .link-btn {
    background:none; border:none; color:#999; font-size:12px; text-decoration:underline;
    display:block; margin:10px auto 0; cursor:pointer;
  }

  /* ---------- STEPPER ---------- */
  .step-dots { display:flex; justify-content:center; gap:6px; margin:6px 0 10px; }
  .step-dot { width:8px; height:8px; border-radius:50%; background:#ccc; cursor:pointer; }
  .step-dot.active { background:#1a3c6e; width:18px; border-radius:4px; }
  .step-dot.done { background:#8bc34a; }
  .step-title {
    font-size:16px; font-weight:bold; color:#1a3c6e; text-align:center;
    margin-bottom:12px; padding-bottom:8px; border-bottom:2px solid #1a3c6e;
  }
  .step-hint { font-size:12px; color:#777; margin:-4px 0 10px; }

  /* ---------- CARD / FORM ---------- */
  .card {
    background:#fff; border-radius:12px; padding:14px;
    margin-bottom:12px; box-shadow:0 1px 4px rgba(0,0,0,0.08);
  }
  .card h2 {
    font-size:14px; margin:0 0 10px; color:#1a3c6e;
    border-left:4px solid #1a3c6e; padding-left:8px;
  }
  label { display:block; font-size:12px; color:#555; margin:8px 0 3px; }
  input[type=text], input[type=number], input[type=date], textarea {
    width:100%; padding:8px; border:1px solid #ccc; border-radius:6px;
    font-size:14px; font-family:inherit; background:#fff;
  }
  textarea { resize:vertical; min-height:44px; }
  .fixed-field {
    padding:8px; background:#f2f4f7; border:1px solid #e0e0e0; border-radius:6px;
    font-size:14px; color:#444;
  }
  .weather-box { margin-top:2px; }
  .weather-ok { font-size:14px; line-height:1.6; background:#eef6ee; border-left:4px solid #2e7d32; border-radius:6px; padding:10px 12px; }
  .weather-meta { font-size:11px; color:#888; margin-top:6px; }
  .weather-loading { font-size:13px; color:#888; padding:10px 0; }
  .weather-warn { font-size:13px; color:#8a6d00; background:#fff8e1; border:1px solid #ffe082; border-radius:6px; padding:10px 12px; line-height:1.6; }
  select {
    width:100%; padding:6px; border:1px solid #ccc; border-radius:6px; font-size:13px;
  }

  .group-badge {
    display:inline-block; font-size:10px; font-weight:bold; color:#fff;
    padding:2px 7px; border-radius:10px; margin-right:6px;
  }
  .grp-A { background:#c2185b; }
  .grp-B { background:#00838f; }
  .grp-C { background:#6a1b9a; }

  .candidate-card {
    border:1px solid #e3d9b8; background:#fffdf5;
    border-radius:8px; padding:10px; margin-bottom:10px;
  }
  .candidate-card.off { opacity:0.45; }
  .cand-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; }
  .cand-tag { font-weight:bold; font-size:12px; color:#8a6d00; }
  .cand-theme { font-size:11px; color:#999; margin-top:2px; }
  .cand-text { font-size:13px; line-height:1.6; }

  .toggle-switch { position:relative; width:42px; height:22px; flex-shrink:0; }
  .toggle-switch input { opacity:0; width:0; height:0; }
  .slider {
    position:absolute; cursor:pointer; inset:0;
    background:#ccc; border-radius:22px; transition:.2s;
  }
  .slider:before {
    content:""; position:absolute; height:16px; width:16px; left:3px; bottom:3px;
    background:white; border-radius:50%; transition:.2s;
  }
  input:checked + .slider { background:#2e7d32; }
  input:checked + .slider:before { transform:translateX(20px); }

  .hazard-edit-card {
    border:1px solid #e3d9b8; background:#fffdf5;
    border-radius:8px; padding:12px; margin-bottom:12px;
  }
  .hazard-edit-head { font-weight:bold; font-size:13px; color:#8a6d00; margin-bottom:4px; }

  .risk-row { display:flex; gap:6px; margin-top:6px; }
  .risk-row > div { flex:1; }
  .risk-row label { margin:2px 0; font-size:11px; }
  .risk-badge {
    display:inline-block; margin-top:6px; padding:3px 8px; border-radius:12px;
    font-size:11px; font-weight:bold; color:#fff;
  }
  .lvl-I{background:#4caf50;} .lvl-II{background:#8bc34a;} .lvl-III{background:#ffa000;}
  .lvl-IV{background:#f4511e;} .lvl-V{background:#c62828;}

  .risk-warning {
    background:#fdecea; border:1px solid #f4c7c3; color:#c62828;
    font-size:12px; border-radius:6px; padding:8px 10px; margin-top:8px; line-height:1.5;
  }
  .ack-row {
    background:#fff3e0; border:1px solid #ffcc80; border-radius:8px;
    padding:10px 12px; font-size:13px; margin-top:6px; display:flex; gap:8px; align-items:flex-start;
  }
  .ack-row input { margin-top:3px; }

  .badge-official {
    display:inline-block; font-size:10px; background:#1a3c6e; color:#fff;
    padding:2px 6px; border-radius:4px; margin-left:6px;
  }
  .badge-trial {
    display:inline-block; font-size:10px; background:#b26a00; color:#fff;
    padding:2px 6px; border-radius:4px; margin-left:6px;
  }
  .badge-custom {
    display:inline-block; font-size:10px; background:#999; color:#fff;
    padding:2px 6px; border-radius:4px; margin-left:6px;
  }
  .pointing-note { font-size:11px; color:#8a6d00; margin:6px 0 10px; line-height:1.5; }
  .word-banner {
    text-align:center; font-weight:bold; color:#c62828; font-size:13px;
    margin:0 0 10px;
  }
  .pointing-row { display:flex; gap:6px; align-items:center; margin-bottom:6px; }
  .pointing-row input { flex:1; }

  .gen-btn, .regen-btn {
    display:block; width:100%; padding:13px; margin-top:6px;
    background:#1a3c6e; color:#fff; border:none; border-radius:8px;
    font-size:15px; font-weight:bold; cursor:pointer;
  }
  .regen-btn { background:#eef1f5; color:#1a3c6e; font-size:13px; padding:10px; }

  /* ---------- PREVIEW CAROUSEL ---------- */
  .carousel {
    background:#fff; border-radius:14px; min-height:420px;
    box-shadow:0 2px 8px rgba(0,0,0,0.12); padding:20px 16px;
    position:relative; display:flex; flex-direction:column;
  }
  .page { display:none; flex:1; }
  .page.active { display:block; }
  .page-title {
    font-size:16px; font-weight:bold; color:#1a3c6e; text-align:center;
    margin-bottom:14px; padding-bottom:8px; border-bottom:2px solid #1a3c6e;
  }
  .page-content { font-size:14px; line-height:1.7; }
  .info-line { display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px dashed #ddd; gap:10px; }
  .info-line span:first-child { color:#666; flex-shrink:0; white-space:nowrap; }
  .info-line span:last-child { font-weight:bold; font-size:16px; text-align:right; word-break:break-word; }

  .hz-card {
    background:#fffdf5; border:1px solid #e3d9b8; border-radius:8px;
    padding:12px; margin-bottom:12px;
  }
  .hz-num { font-size:11px; color:#8a6d00; font-weight:bold; margin-bottom:4px; }
  .hz-text { font-size:14px; margin-bottom:8px; }
  .hz-scores { display:flex; gap:6px; font-size:11px; flex-wrap:wrap; }
  .score-chip { background:#eef1f5; padding:4px 7px; border-radius:6px; }

  .goal-card {
    background:#eef6ee; border-left:4px solid #2e7d32; border-radius:6px;
    padding:10px 12px; margin-bottom:10px; font-size:14px;
  }
  .pt-card {
    background:#f5f8fc; border-radius:8px; padding:10px 12px; margin-bottom:10px;
  }
  .pt-num { font-weight:bold; color:#1a3c6e; }
  .pt-call { color:#c62828; font-weight:bold; margin-top:3px; }
  .kun-card, .word-card {
    padding:10px 12px; margin-bottom:8px; border-radius:8px; font-size:14px;
    background:#faf7ef; border-left:4px solid #b08d00;
  }
  .word-card { background:#f0f5fb; border-left:4px solid #1a3c6e; }

  .nav-row { display:flex; justify-content:space-between; align-items:center; margin-top:16px; gap:8px; }
  .nav-btn {
    padding:10px 18px; border:none; border-radius:8px; background:#1a3c6e; color:#fff;
    font-size:14px; font-weight:bold; cursor:pointer; flex-shrink:0;
  }
  .nav-btn:disabled { background:#ccc; }
  .save-btn { background:#2e7d32; }

  .back-edit { text-align:center; margin-top:10px; }
  .back-edit button {
    background:none; border:none; color:#1a3c6e; font-size:13px; text-decoration:underline; cursor:pointer;
  }

  /* ---------- SAVED LIST ---------- */
  .saved-item {
    background:#fff; border-radius:10px; padding:12px; margin-bottom:10px;
    box-shadow:0 1px 4px rgba(0,0,0,0.08);
  }
  .saved-item .date { font-size:15px; font-weight:bold; color:#1a3c6e; }
  .saved-item .meta { font-size:12px; color:#777; margin:4px 0 8px; }
  .saved-actions { display:flex; gap:6px; flex-wrap:wrap; }
  .saved-actions button {
    flex:1; min-width:70px; padding:8px; border:none; border-radius:6px;
    font-size:12px; font-weight:bold; cursor:pointer; background:#eef1f5; color:#1a3c6e;
  }
  .saved-actions button.danger { background:#fdecea; color:#c62828; }
  .empty-note { text-align:center; color:#999; font-size:13px; padding:20px 0; }

  /* ---------- BACKUP TOOLBAR / IMPORT MODAL ---------- */
  .backup-toolbar { display:flex; gap:8px; margin-bottom:14px; }
  .backup-toolbar .sub-btn { margin-top:0; font-size:12px; padding:10px 6px; }
  .modal-overlay {
    display:none; position:fixed; inset:0; background:rgba(0,0,0,0.45);
    align-items:center; justify-content:center; z-index:100; padding:20px;
  }
  .modal-overlay.show { display:flex; }
  .modal-card {
    background:#fff; border-radius:12px; padding:18px; max-width:400px; width:100%;
    box-shadow:0 4px 20px rgba(0,0,0,0.25);
  }
  .modal-card p { font-size:13px; line-height:1.6; }
  .modal-actions { display:flex; flex-direction:column; gap:8px; margin-top:10px; }
</style>
</head>
<body>
<div class="wrap" id="app">
  <h1>危険予知（KY）活動表</h1>
  <div class="sub" id="subtitle"></div>
  <div class="save-indicator" id="saveIndicator">&nbsp;</div>

  <!-- ============ HOME ============ -->
  <div id="screenHome" class="screen active">
    <div class="home-card">
      <button class="big-btn" onclick="startNewFromHome()">KYを作成</button>
    </div>

    <div class="home-card" id="draftCard" style="display:none;">
      <h2>作成中</h2>
      <div class="draft-line"><b id="draftDateLabel"></b> の下書きがあります</div>
      <button class="sub-btn" onclick="resumeDraft()">続きから再開する</button>
      <button class="link-btn" onclick="discardDraftAndNew()">下書きを破棄して新規作成する</button>
    </div>

    <div class="home-card">
      <h2>保存済み</h2>
      <button class="sub-btn" onclick="showScreen('savedList')">一覧を見る（<span id="savedCount">0</span>件）</button>
    </div>
  </div>

  <!-- ============ CREATE FLOW ============ -->
  <div id="screenCreate" class="screen">
    <div class="step-dots" id="stepDots"></div>
    <div id="stepBody"></div>
    <div class="nav-row">
      <button class="nav-btn" id="prevBtn" onclick="prevStep()">◀ 戻る</button>
      <button class="nav-btn" id="nextBtn" onclick="nextStep()">次へ ▶</button>
    </div>
    <div class="back-edit"><button onclick="goHomeKeepDraft()">← ホームに戻る（下書きは保存されます）</button></div>
  </div>

  <!-- ============ SAVED LIST ============ -->
  <div id="screenSavedList" class="screen">
    <div class="step-title">保存済みKY活動表</div>
    <div class="backup-toolbar">
      <button class="sub-btn" onclick="exportRecordsToFile()">⬇ JSONエクスポート</button>
      <button class="sub-btn" onclick="triggerImportFile()">⬆ JSONインポート</button>
      <input type="file" id="importFileInput" accept="application/json" style="display:none" onchange="handleImportFile(event)">
    </div>
    <div id="savedListBody"></div>
    <div class="back-edit"><button onclick="showScreen('home')">← ホームに戻る</button></div>
  </div>

  <!-- ============ IMPORT CONFIRM MODAL ============ -->
  <div id="importModal" class="modal-overlay">
    <div class="modal-card">
      <h2 style="font-size:14px;color:#1a3c6e;margin:0 0 10px;">JSONインポートの確認</h2>
      <div id="importModalBody"></div>
      <div class="modal-actions">
        <button class="sub-btn" onclick="confirmImport('add')">追加する</button>
        <button class="sub-btn" style="background:#fdecea;color:#c62828;" onclick="confirmImport('replace')">置換する（既存を上書き）</button>
        <button class="link-btn" style="margin-top:6px;" onclick="closeImportModal()">キャンセル</button>
      </div>
    </div>
  </div>

  <!-- ============ READONLY VIEW ============ -->
  <div id="screenView" class="screen">
    <div class="carousel">
      <div id="viewPagesContainer"></div>
      <div class="nav-row">
        <button class="nav-btn" id="viewPrevBtn" onclick="viewNavPage(-1)">◀ 前へ</button>
        <div class="step-dots" id="viewDots" style="margin:0;"></div>
        <button class="nav-btn" id="viewNextBtn" onclick="viewNavPage(1)">次へ ▶</button>
      </div>
    </div>
    <div class="back-edit"><button onclick="showScreen('savedList')">← 一覧に戻る</button></div>
  </div>

</div>

<script>
/* =========================================================================
   KY_CONFIG — 会社名・候補生成ルール・正式指差呼称9項目・安全十訓・
   接客10大用語など、仕様に関わる設定をすべてここに集約する。
   今後の仕様変更（会社名変更、候補数変更、項目文言の変更等）は
   この KY_CONFIG のみを変更すれば反映される。
   ========================================================================= */
const KY_CONFIG = {
  companyName: "中日本ハイウェイ・メンテナンス東名（株）",
  subTitle: "中日本ハイウェイ・メンテナンス東名（株）／清掃作業",
  schemaVersion: 2, // localStorage/エクスポートJSONのデータ構造バージョン。構造変更時は必ず上げること。
  candidateGroups: 3,      // テーマ数
  variantsPerGroup: 2,     // テーマごとの案数
  maxCandidates: 6,        // candidateGroups * variantsPerGroup
  defaultWorkers: 3,
  fixedWorkContent: '清掃業務', // 作業内容は自由入力にせずこの内容で固定する
  riskWarnLevels: ['III','IV','V'], // 対策後にこの危険度が残る場合は警告

  // 天気予報取得設定（Open-Meteo。APIキー不要・CORS許可済みでクライアントから直接取得可能）
  weatherLocation: { name: '駿河湾沼津SA周辺（沼津市）', latitude: 35.09, longitude: 138.86 },
  weatherForecastMaxDays: 16, // この日数より先の未来日は予報取得対象外として扱う

  storageKeys: {
    draft: 'ky_current_draft',
    records: 'ky_saved_records'
  },

  // 正式指差呼称9項目（正本）。これ以外は必ず「※手順書外・独自項目」表示。
  // 指差呼称マスター。status: 'basic'=正式9項目 / 'trial'=社内試行資料（環境整備版）掲載の追加6項目。
  // 現時点で写真資料から確認できたのはこの15項目のみ。未確認の項目を推測で追加しない。
  trialSourceNote: '「指差呼称の定着化に向けた重点項目（試行案）環境整備版」（2025年5月9日付）に掲載。恒久的な正式項目としての採用は未確認。',
  officialPointing: [
    // ---- A. 基本9項目（正式） ----
    { id:1, status:'basic', category:'駐車場清掃時',               call:'服装の確認　良いか',           response:'服装確認　ヨシ',           note:'ヘルメット・安全チョッキ' },
    { id:2, status:'basic', category:'駐車場清掃時',               call:'前後左右　良いか',             response:'前後左右　ヨシ',           note:'駐車マス移動・横断時' },
    { id:3, status:'basic', category:'ごみボックス回収時',          call:'カートブレーキの確認　良いか',  response:'カートブレーキ確認　ヨシ', note:'ON・OFF' },
    { id:4, status:'basic', category:'ごみボックス回収時',          call:'周囲の確認　良いか',           response:'周囲の確認　ヨシ',         note:'移動・横断時' },
    { id:5, status:'basic', category:'ごみボックス回収時',          call:'輪止めの設置　良いか',         response:'輪止めの設置　ヨシ',       note:'回収作業中' },
    { id:6, status:'basic', category:'トイレ・休憩施設・商業施設清掃時', call:'周囲の確認　良いか',       response:'周囲の確認　ヨシ',         note:'お客様の状況' },
    { id:7, status:'basic', category:'トイレ・休憩施設・商業施設清掃時', call:'看板設置　良いか',         response:'看板設置　ヨシ',           note:'内容・設置場所' },
    { id:8, status:'basic', category:'トイレ・休憩施設・商業施設清掃時', call:'用具の置き忘れ　良いか',   response:'用具の置き忘れ　ヨシ',     note:'作業終了時' },
    { id:9, status:'basic', category:'防犯対策',                   call:'施錠確認　良いか',             response:'施錠確認　ヨシ',           note:'スタッフルーム等退出時' },
    // ---- B. 社内「試行案・環境整備版」で確認された追加項目（正式採用は未確定） ----
    { id:10, status:'trial', category:'用具・道具類',   call:'ゴミカートの状態　良いか',   response:'ゴミカート状態　ヨシ',   note:'ブレーキ・破損等' },
    { id:11, status:'trial', category:'用具・道具類',   call:'道具の状態　良いか',         response:'道具状態　ヨシ',         note:'ほうき・モップ等の破損' },
    { id:12, status:'trial', category:'用具・道具類',   call:'保護具の着用　良いか',       response:'保護具の着用　ヨシ',     note:'手袋・ゴーグル等' },
    { id:13, status:'trial', category:'熱中症対策',     call:'休憩　良いか',               response:'休憩　ヨシ' },
    { id:14, status:'trial', category:'熱中症対策',     call:'水分補給　良いか',           response:'水分補給　ヨシ' },
    { id:15, status:'trial', category:'熱中症対策',     call:'熱中症キット配備　良いか',   response:'熱中症キット配備　ヨシ' }
  ],

  // 安全十訓（正本・変更しない）
  safetyPrinciples: [
    { id:1,  text:'事故は、決められたことを守らぬときに、起きやすい' },
    { id:2,  text:'事故は、慌てた時に、起きやすい' },
    { id:3,  text:'事故は、仕事の不慣れな時に、起きやすい' },
    { id:4,  text:'事故は、憶測で仕事をするときに、起きやすい' },
    { id:5,  text:'事故は、仕事に慣れ過ぎた時に、起きやすい' },
    { id:6,  text:'事故は、連絡を欠いた時に、起きやすい' },
    { id:7,  text:'事故は、平素とやり方を変えた時に、起きやすい' },

/* =========================================================================
   ユーティリティ
   ========================================================================= */
const WEEKDAY_KANJI = ['日','月','火','水','木','金','土'];

function pad2(n){ return String(n).padStart(2,'0'); }

function isoFromDate(d){ return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; }

function dateFromIso(iso){
  const [y,m,d] = iso.split('-').map(Number);
  return new Date(y, m-1, d);
}

function formatDateJP(iso){
  if(!iso) return '';
  const d = dateFromIso(iso);
  return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日（${WEEKDAY_KANJI[d.getDay()]}）`;
}

function seasonOf(month){
  if(month>=3 && month<=5) return '春';
  if(month>=6 && month<=8) return '夏';
  if(month>=9 && month<=11) return '秋';
  return '冬';
}

/* =========================================================================
   天気予報取得（Open-Meteo）
   ========================================================================= */
const WEATHER_CODE_LABELS = {
  0:'快晴', 1:'晴れ', 2:'晴れ時々曇り', 3:'曇り',
  45:'霧', 48:'霧（霜）',
  51:'弱い霧雨', 53:'霧雨', 55:'強い霧雨',
  56:'弱い着氷性の霧雨', 57:'着氷性の霧雨',
  61:'弱い雨', 63:'雨', 65:'強い雨',
  66:'弱い着氷性の雨', 67:'着氷性の雨',
  71:'弱い雪', 73:'雪', 75:'強い雪', 77:'雪あられ',
  80:'にわか雨（弱）', 81:'にわか雨', 82:'激しいにわか雨',
  85:'にわか雪（弱）', 86:'にわか雪',
  95:'雷雨', 96:'雷雨（ひょうを伴う）', 99:'激しい雷雨（ひょうを伴う）'
};
function weatherCodeLabel(code){ return WEATHER_CODE_LABELS[code] || `天候コード${code}`; }

function windDirLabel(deg){
  if(deg==null) return '';
  const dirs = ['北','北東','東','南東','南','南西','西','北西'];
  return dirs[Math.round(((deg%360)+360)%360 / 45) % 8];
}

// 対象日の天気を取得する。予報取得可能範囲外・データ欠落・通信失敗のいずれも
// 推測で埋めず、呼び出し側にstatusとして明示的に伝える。
async function fetchWeatherForDate(dateIso){
  const today = isoFromDate(new Date());
  const loc = KY_CONFIG.weatherLocation;
  const diffDays = Math.round((dateFromIso(dateIso) - dateFromIso(today)) / 86400000);

  if(diffDays > KY_CONFIG.weatherForecastMaxDays){
    return { status:'out_of_range', fetchedAt:new Date().toISOString() };
  }

  let url, source;
  if(diffDays < 0){
    source = 'open-meteo-archive';
    url = `https://archive-api.open-meteo.com/v1/archive?latitude=${loc.latitude}&longitude=${loc.longitude}`
      + `&start_date=${dateIso}&end_date=${dateIso}`
      + `&daily=weathercode,temperature_2m_max,temperature_2m_min,precipitation_sum,windspeed_10m_max,winddirection_10m_dominant`
      + `&hourly=relative_humidity_2m&timezone=Asia%2FTokyo`;
  } else {
    source = 'open-meteo-forecast';
    url = `https://api.open-meteo.com/v1/forecast?latitude=${loc.latitude}&longitude=${loc.longitude}`
      + `&daily=weathercode,temperature_2m_max,temperature_2m_min,apparent_temperature_max,precipitation_sum,precipitation_probability_max,windspeed_10m_max,winddirection_10m_dominant`
      + `&hourly=relative_humidity_2m&timezone=Asia%2FTokyo&forecast_days=${Math.max(diffDays+1,1)}`;
  }

  try{
    const res = await fetch(url);
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const json = await res.json();
    const di = json.daily && json.daily.time ? json.daily.time.indexOf(dateIso) : -1;
    if(di === -1){
      return { status:'unavailable', fetchedAt:new Date().toISOString() };
    }
    let humidity = null;
    if(json.hourly && json.hourly.time){
      const vals = [];
      json.hourly.time.forEach((t,i)=>{ if(t.startsWith(dateIso)) vals.push(json.hourly.relative_humidity_2m[i]); });
      if(vals.length) humidity = Math.round(vals.reduce((a,b)=>a+b,0)/vals.length);
    }
    const data = {
      weathercode: json.daily.weathercode[di],
      tempMax: json.daily.temperature_2m_max[di],
      tempMin: json.daily.temperature_2m_min[di],
      apparentTempMax: json.daily.apparent_temperature_max ? json.daily.apparent_temperature_max[di] : null,
      precipSum: json.daily.precipitation_sum ? json.daily.precipitation_sum[di] : null,
      precipProbability: json.daily.precipitation_probability_max ? json.daily.precipitation_probability_max[di] : null,
      windMax: json.daily.windspeed_10m_max[di],
      windDirection: json.daily.winddirection_10m_dominant[di],
      humidity
    };
    return { status:'ok', source, data, fetchedAt:new Date().toISOString() };
  }catch(e){
    return { status:'error', fetchedAt:new Date().toISOString(), errorMessage:String(e && e.message || e) };
  }
}

// 危険ポイント候補生成の関連度判定にそのまま使えるよう、雨・強風・猛暑・寒さ等の
// キーワードを含む一文にまとめる（既存のキーワード一致ロジックをそのまま活かす）。
function buildWeatherSummary(data){
  const label = weatherCodeLabel(data.weathercode);
  const parts = [label, `最高${Math.round(data.tempMax)}℃`, `最低${Math.round(data.tempMin)}℃`];
  if(data.precipProbability!=null) parts.push(`降水確率${data.precipProbability}%`);
  else if(data.precipSum!=null) parts.push(`降水量${data.precipSum}mm`);
  if(data.windMax!=null) parts.push(`${windDirLabel(data.windDirection)}の風　最大${Math.round(data.windMax)}m/s`);
  if(data.humidity!=null) parts.push(`湿度${data.humidity}%`);

  const tags = [];
  const heavyRain = (data.precipProbability!=null && data.precipProbability>=50) || (data.precipSum!=null && data.precipSum>=5);
  if(heavyRain) tags.push('雨');
  if(data.windMax!=null && data.windMax>=10) tags.push('強風');
  const feelsLike = data.apparentTempMax!=null ? data.apparentTempMax : data.tempMax;
  if(feelsLike>=33 || (data.tempMax>=31 && data.humidity!=null && data.humidity>=65)) tags.push('猛暑・熱中症警戒');
  if(data.tempMin<=3) tags.push('寒気・凍結注意');
  if(tags.length) parts.push(`（${tags.join('・')}）`);

  return parts.join('　');
}

function levelInfo(p,s){
  const score = p*s;
  let lvl, name;
  if(score===1){lvl='I';name='極めて小さい';}
  else if(score===2){lvl='II';name='かなり小さい';}
  else if(score>=3 && score<=4){lvl='III';name='中程度';}
  else if(score===6){lvl='IV';name='かなり大きい';}
  else {lvl='V';name='極めて大きい';}
  return {score, lvl, name};
}

function isOfficialText(text){
  return KY_CONFIG.officialPointing.find(o => o.call === (text||'').trim());
}

// 指差呼称の分類バッジHTMLを一箇所で生成する（basic=手順書／trial=試行案／custom=独自項目）
function pointingBadgeHtml(text){
  const match = isOfficialText(text);
  if(match && match.status==='basic') return '<span class="badge-official">手順書</span>';
  if(match && match.status==='trial') return '<span class="badge-trial">試行案（未確定）</span>';
  return '<span class="badge-custom">※手順書外・独自項目</span>';
}

/* =========================================================================
   バックアップ（JSONエクスポート／インポート）
   file:// と固定URL（GitHub Pages等）とでlocalStorageのoriginが分かれるため、
   移行や機種変更時はエクスポート→インポートで保存済みKYを引き継ぐ。
   ========================================================================= */
function exportRecordsToFile(){
  const payload = {
    schemaVersion: KY_CONFIG.schemaVersion,
    exportedAt: new Date().toISOString(),
    savedRecords: loadRecords()
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const d = new Date();
  const a = document.createElement('a');
  a.href = url;
  a.download = `ky_export_${d.getFullYear()}${pad2(d.getMonth()+1)}${pad2(d.getDate())}_${pad2(d.getHours())}${pad2(d.getMinutes())}${pad2(d.getSeconds())}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function triggerImportFile(){
  document.getElementById('importFileInput').click();
}

let pendingImport = null;

function handleImportFile(event){
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    let parsed;
    try{
      parsed = JSON.parse(reader.result);
    }catch(e){
      alert('JSONファイルの読み込みに失敗しました。ファイル形式を確認してください。');
      event.target.value = '';
      return;
    }
    if(!parsed || !Array.isArray(parsed.savedRecords)){
      alert('インポートできる形式ではありません（savedRecordsが見つかりません）。');
      event.target.value = '';
      return;
    }
    pendingImport = parsed;
    showImportModal(parsed);
    event.target.value = '';
  };
  reader.readAsText(file);
}

function showImportModal(parsed){
  const versionMismatch = parsed.schemaVersion !== KY_CONFIG.schemaVersion;
  const count = parsed.savedRecords.length;
  const currentCount = loadRecords().length;
  document.getElementById('importModalBody').innerHTML = `
    <p>インポートするファイル：<b>${count}件</b>のKY活動表</p>
    <p>ファイルのschemaVersion：<b>${escHtml(String(parsed.schemaVersion))}</b>（アプリ側：${KY_CONFIG.schemaVersion}）</p>
    ${versionMismatch ? `<p style="color:#c62828;font-weight:bold;">⚠ schemaVersionが一致しません。データ構造が異なる可能性があります。内容を確認のうえ進めてください。</p>` : ''}
    <p>現在の保存済みデータ（${currentCount}件）にどう反映しますか？</p>
  `;
  document.getElementById('importModal').classList.add('show');
}

function closeImportModal(){
  document.getElementById('importModal').classList.remove('show');
  pendingImport = null;
}

function confirmImport(mode){
  if(!pendingImport) return;
  const incoming = pendingImport.savedRecords;
  if(mode==='replace'){
    const existing = loadRecords();
    if(!confirm(`既存の${existing.length}件を破棄し、インポートした${incoming.length}件に置き換えます。この操作は元に戻せません。よろしいですか？`)) return;
    saveRecords(incoming);
  } else if(mode==='add'){
    const existing = loadRecords();
    const existingIds = new Set(existing.map(r=>r.id));
    const merged = existing.concat(incoming.filter(r=>!existingIds.has(r.id)));
    saveRecords(merged);
  }
  closeImportModal();
  renderSavedList();
  refreshHome();
  alert('インポートが完了しました。');
}

/* =========================================================================
   候補生成
   ========================================================================= */
function buildContextText(basic){
  return `${basic.work||''} ${basic.weather||''}`.trim();
}

function scoreTheme(theme, ctx){
  let score = 0.15; // 常にどのテーマにも選ばれる可能性を残すベース値
  (theme.keywords||[]).forEach(k=>{
    if(ctx.text.includes(k.w)) score += k.wt;
  });
  if(theme.weekendBoost && ctx.isWeekend) score += theme.weekendBoost;
  if(theme.seasons && theme.seasons.includes(ctx.season)) score += 1;
  return score + Math.random()*0.5; // 日によって偏らないよう揺らぎを持たせる
}

function pickThemeForGroup(group, ctx){
  const themes = KY_CONFIG.themePool.filter(t=>t.group===group);
  let best = null, bestScore = -1;
  themes.forEach(t=>{
    const sc = scoreTheme(t, ctx);
    if(sc > bestScore){ bestScore = sc; best = t; }
  });
  return best;
}

function generateCandidates(basic){
  const d = dateFromIso(basic.dateIso || isoFromDate(new Date()));
  const ctx = {
    text: buildContextText(basic),
    isWeekend: (d.getDay()===0 || d.getDay()===6),
    season: seasonOf(d.getMonth()+1)
  };
  const groups = ['A','B','C'];
  const candidates = [];
  groups.forEach(g=>{
    const theme = pickThemeForGroup(g, ctx);
    theme.variants.forEach((v, vi)=>{
      candidates.push({
        key: uid(),
        group: g,
        themeId: theme.id,
        themeLabel: theme.label,
        variantLabel: `${g}${vi+1}`,
        adopted: vi===0,
        hazard: v.hazard,
        pre: { p: v.pre.p, s: v.pre.s },
        action: v.action,
        post: { p: v.post.p, s: v.post.s },
        goal: v.goal,
        pointing: v.pointing.map(p=>({ text: p.text }))
      });
    });
  });
  return candidates;
}

const STEP_TITLES = [
  '',
  '① 基本情報',
  '② 危険ポイント候補（採用する案を選択）',
  '③ 内容編集（危険ポイント・対策）',
  '④ 本日の安全目標',
  '⑤ 指差呼称・安全十訓・接客10大用語',
  '⑥ 最終確認・保存'
];
const TOTAL_STEPS = 6;

function renderStepDots(){
  const el = document.getElementById('stepDots');
  el.innerHTML = '';
  for(let i=1;i<=TOTAL_STEPS;i++){
    const dot = document.createElement('div');
    dot.className = 'step-dot' + (i===state.step?' active':'') + (i<state.step?' done':'');
    dot.onclick = ()=>{ if(i<=state.step || i===state.step+1) tryGoToStep(i); else tryGoToStep(i); };
    el.appendChild(dot);
  }
}

function tryGoToStep(target){
  if(target === state.step){ return; }
  if(target > state.step){
    // 前進はバリデーションを通す
    while(state.step < target){
      if(!validateStep(state.step)) return;
      state.step++;
    }
  } else {
    state.step = target;
  }
  renderStep();
}

function renderStep(){
  renderStepDots();
  document.getElementById('prevBtn').disabled = (state.step===1);
  document.getElementById('nextBtn').textContent = state.step===TOTAL_STEPS ? '完了' : (state.step===1 ? 'この内容でKY候補を作成' : '次へ ▶');
  const body = document.getElementById('stepBody');
  body.innerHTML = `<div class="step-title">${STEP_TITLES[state.step]}</div>` + stepHtml(state.step);
  bindStepEvents(state.step);
  scheduleSave();
}

function stepHtml(step){
  if(step===1) return stepBasicHtml();
  if(step===2) return stepCandidatesHtml();
  if(step===3) return stepEditHtml();
  if(step===4) return stepGoalHtml();
  if(step===5) return stepPointingHtml();
  if(step===6) return stepFinalHtml();
  return '';
}

function nextStep(){
  if(state.step === TOTAL_STEPS){
    // 完了 = ホームへ（保存は最終ステップ内のボタンで行う）
    goHomeKeepDraft();
    return;
  }
  if(!validateStep(state.step)) return;
  state.step++;
  renderStep();
}

function prevStep(){
  if(state.step===1) return;
  state.step--;
  renderStep();
}

function validateStep(step){
  if(step===1){
    if(state.basic.weatherStatus === 'loading'){
      alert('天気情報を取得中です。少々お待ちください。');
      return false;
    }
    // 候補が未生成、または基本情報を変えて再生成が必要な場合は自動生成
    if(state.candidates.length===0){
      state.candidates = generateCandidates(state.basic);
    }
    return true;
  }
  if(step===2){
    if(!state.candidates.some(c=>c.adopted)){
      alert('危険ポイント候補を1つ以上選択してください。');
      return false;
    }
    return true;
  }
  if(step===3){
    const warn = adoptedList().some(c=>KY_CONFIG.riskWarnLevels.includes(levelInfo(c.post.p,c.post.s).lvl));
    if(warn && !state.ackHighRisk){
      alert('対策後の危険度がⅢ以上の項目があります。対策を見直すか、確認チェックを入れてください。');
      return false;
    }
    return true;
  }
  return true;
}

function adoptedList(){
  return state.candidates.filter(c=>c.adopted);
}

    <p class="step-hint">対象日の天気予報を取得し、次のステップで表示する危険ポイント候補の選定に使います。日付を変更すると天気は自動的に取り直されます。</p>
  `;

function bindBasic(){
  const dateEl = document.getElementById('in_date');
  const workersEl = document.getElementById('in_workers');
  dateEl.addEventListener('change', ()=>{
    state.basic.dateIso = dateEl.value;
    scheduleSave();
    refreshWeatherForCurrentDate();
  });
  workersEl.addEventListener('input', ()=>{
    state.basic.workers = parseInt(workersEl.value)||0;
    scheduleSave();
  });

  if(state.basic.weatherDateIso !== state.basic.dateIso || !state.basic.weatherStatus){
    refreshWeatherForCurrentDate();
  } else {
    renderWeatherBox();
  }
}

async function refreshWeatherForCurrentDate(){
  const dateIso = state.basic.dateIso;
  state.basic.weatherStatus = 'loading';
  state.basic.weatherDateIso = dateIso;
  renderWeatherBox();

  const result = await fetchWeatherForDate(dateIso);
  if(!state || state.basic.dateIso !== dateIso) return; // 取得中に日付が変わっていたら古い結果は捨てる

  state.basic.weatherFetchedAt = result.fetchedAt;
  if(result.status === 'ok'){
    state.basic.weatherStatus = 'ok';
    state.basic.weatherSource = result.source;
    state.basic.weatherData = result.data;
    state.basic.weather = buildWeatherSummary(result.data);
  } else {
    state.basic.weatherStatus = result.status; // 'unavailable' | 'out_of_range' | 'error'
    state.basic.weatherSource = result.status;
    state.basic.weatherData = null;
    state.basic.weather = '';
  }
  renderWeatherBox();
  scheduleSave();
}

function renderWeatherBox(){
  const box = document.getElementById('weatherBox');
  if(!box) return;
  const st = state.basic.weatherStatus;
  let html;
  if(st === 'ok'){
    const fetchedLabel = state.basic.weatherFetchedAt ? new Date(state.basic.weatherFetchedAt).toLocaleString('ja-JP') : '';
    const sourceLabel = state.basic.weatherSource === 'open-meteo-archive' ? 'Open-Meteo（実績）' : 'Open-Meteo（予報）';
    html = `<div class="weather-ok">${escHtml(state.basic.weather)}</div>
            <div class="weather-meta">取得日時：${fetchedLabel}／出典：${sourceLabel}</div>`;
  } else if(st === 'out_of_range'){
    html = `<div class="weather-warn">この日付の天気予報はまだ取得できません（目安：${KY_CONFIG.weatherForecastMaxDays}日先まで）。天気未反映のまま作成するか、日付を変更してください。</div>`;
  } else if(st === 'unavailable'){
    html = `<div class="weather-warn">この日付の天気データが見つかりませんでした。天気未反映のまま作成するか、日付を変更してください。</div>`;
  } else if(st === 'error'){
    html = `<div class="weather-warn">天気情報の取得に失敗しました（通信エラー）。天気未反映のまま作成するか、後でやり直してください。</div>`;
  } else {
    html = `<div class="weather-loading">取得中…</div>`;
  }
  box.innerHTML = html;
  const nextBtn = document.getElementById('nextBtn');
  if(nextBtn) nextBtn.disabled = (st === 'loading');
}

/* ---- Step2: 候補選択 ---- */
function stepCandidatesHtml(){
  if(state.candidates.length===0){
    state.candidates = generateCandidates(state.basic);
  }
  const groupLabel = { A:'グループA：お客様・車両・接触系', B:'グループB：天候・季節・体調系', C:'グループC：作業内容・混雑・設備系' };
  let html = '<div class="card"><p class="step-hint" style="margin-top:0;">状況に応じて選ばれた3テーマ×2案、計6候補です。採用するものをON/OFFで選んでください（1〜3個程度が目安）。文言は次のステップで自由に編集できます。</p>';
  ['A','B','C'].forEach(g=>{
    const items = state.candidates.filter(c=>c.group===g);
    if(items.length===0) return;
    html += `<div style="margin:10px 0 4px;"><span class="group-badge grp-${g}">${g}</span><b style="font-size:12px;color:#555;">${groupLabel[g]}（${items[0].themeLabel}）</b></div>`;
    items.forEach(c=>{
      html += `
        <div class="candidate-card ${c.adopted?'':'off'}" id="cand_${c.key}">
          <div class="cand-head">
            <div>
              <span class="cand-tag">候補${c.variantLabel}</span>
              <div class="cand-theme">${c.themeLabel}</div>
            </div>
            <label class="toggle-switch">
              <input type="checkbox" ${c.adopted?'checked':''} data-key="${c.key}" class="cand-toggle">
              <span class="slider"></span>
            </label>
          </div>
          <div class="cand-text">${escHtml(c.hazard)}</div>
        </div>`;
    });
  });
  html += '</div><button class="regen-btn" id="regenBtn">🔄 候補を再生成する</button>';
  return html;
}

function bindCandidates(){
  document.querySelectorAll('.cand-toggle').forEach(cb=>{
    cb.addEventListener('change', ()=>{
      const c = state.candidates.find(x=>x.key===cb.dataset.key);
      c.adopted = cb.checked;
      document.getElementById('cand_'+c.key).classList.toggle('off', !c.adopted);
      scheduleSave();
    });
  });
  const regen = document.getElementById('regenBtn');
  if(regen){
    regen.addEventListener('click', ()=>{
      if(!confirm('候補を再生成します。現在の候補・編集内容は失われます。よろしいですか？')) return;
      state.candidates = generateCandidates(state.basic);
      renderStep();
    });
  }
}

        <textarea class="ed_action">${escHtml(c.action)}</textarea>

          <div><label>可能性(対策後)</label>
            <select class="ed_post_p">
              <option value="1" ${c.post.p===1?'selected':''}>1:ほとんど起こらない</option>
              <option value="2" ${c.post.p===2?'selected':''}>2:たまに起こる</option>
              <option value="3" ${c.post.p===3?'selected':''}>3:かなり起こる</option>
            </select>
          </div>
          <div><label>重大性(対策後)</label>
            <select class="ed_post_s">
              <option value="1" ${c.post.s===1?'selected':''}>1:軽傷</option>
              <option value="2" ${c.post.s===2?'selected':''}>2:中度</option>
              <option value="3" ${c.post.s===3?'selected':''}>3:死亡・障害</option>
            </select>

        ${warn ? `<div class="risk-warning">⚠ 対策後の危険度がⅡを超えています（原則Ⅱ以下を目標としてください）。対策内容を見直すか、下の確認欄にチェックしてください。</div>` : ''}
      </div>`;
  });
  const anyWarn = list.some(c=>KY_CONFIG.riskWarnLevels.includes(levelInfo(c.post.p,c.post.s).lvl));
  if(anyWarn){
    html += `<div class="ack-row">
      <input type="checkbox" id="ackHighRisk" ${state.ackHighRisk?'checked':''}>
      <label style="margin:0;" for="ackHighRisk">対策後も危険度Ⅲ以上が残る項目があることを確認しました。このまま次へ進みます。</label>
    </div>`;
  }
  return html;
}

function bindEdit(){
  document.querySelectorAll('.hazard-edit-card').forEach(card=>{
    const key = card.dataset.key;
    const c = state.candidates.find(x=>x.key===key);
    const hazardEl = card.querySelector('.ed_hazard');
    const actionEl = card.querySelector('.ed_action');
    const prep = card.querySelector('.ed_pre_p');
    const pres = card.querySelector('.ed_pre_s');
    const postp = card.querySelector('.ed_post_p');
    const posts = card.querySelector('.ed_post_s');

    function refreshBadges(){
      const pre = levelInfo(parseInt(prep.value), parseInt(pres.value));
      const post = levelInfo(parseInt(postp.value), parseInt(posts.value));
      card.querySelector('.pre-badge').innerHTML = `評価点${pre.score}／危険度<span class="risk-badge lvl-${pre.lvl}">${pre.lvl}（${pre.name}）</span>`;
      card.querySelector('.post-badge').innerHTML = `評価点${post.score}／危険度<span class="risk-badge lvl-${post.lvl}">${post.lvl}（${post.name}）</span>`;
      c.pre.p = parseInt(prep.value); c.pre.s = parseInt(pres.value);
      c.post.p = parseInt(postp.value); c.post.s = parseInt(posts.value);
      const warnNow = KY_CONFIG.riskWarnLevels.includes(post.lvl);
      let warnDiv = card.querySelector('.risk-warning');
      if(warnNow && !warnDiv){
        warnDiv = document.createElement('div');
        warnDiv.className = 'risk-warning';
        warnDiv.textContent = '⚠ 対策後の危険度がⅡを超えています（原則Ⅱ以下を目標としてください）。対策内容を見直すか、下の確認欄にチェックしてください。';
        card.appendChild(warnDiv);
        state.ackHighRisk = false;
        renderStep();
        return;
      } else if(!warnNow && warnDiv){
        renderStep();
        return;
      }
      scheduleSave();
    }
    [prep,pres,postp,posts].forEach(el=>el.addEventListener('change', refreshBadges));
    hazardEl.addEventListener('input', ()=>{ c.hazard = hazardEl.value; scheduleSave(); });
    actionEl.addEventListener('input', ()=>{ c.action = actionEl.value; scheduleSave(); });
  });
  const ack = document.getElementById('ackHighRisk');
  if(ack) ack.addEventListener('change', ()=>{ state.ackHighRisk = ack.checked; scheduleSave(); });
}

/* ---- Step6: 最終確認・保存（プレビューカルーセル） ---- */
let finalPage = 0, finalTotal = 0;

      <div class="info-line"><span>作業日</span><span>${formatDateJP(basic.dateIso)}</span></div>

      <div class="info-line"><span>本日の天気</span><span style="font-size:12px;font-weight:normal;">${escHtml(basic.weather)}</span></div>
    </div>
  `);

  let p2 = `<div class="page-title">② 作業での危険ポイント</div><div class="page-content">`;
  list.forEach((h,idx)=>{
    const pre = levelInfo(h.pre.p, h.pre.s);
    p2 += `<div class="hz-card"><div class="hz-num">危険ポイント${idx+1}（${h.themeLabel}）</div><div class="hz-text">${escHtml(h.hazard)}</div>

  });
  pages.push(p2 + '</div>');

  let p3 = `<div class="page-title">③ 私達はこうします</div><div class="page-content">`;
  list.forEach((h,idx)=>{
    const post = levelInfo(h.post.p, h.post.s);
    p3 += `<div class="hz-card"><div class="hz-num">危険ポイント${idx+1} への対策</div><div class="hz-text">${escHtml(h.action)}</div>
      <div class="hz-scores"><span class="score-chip">評価点 ${post.score}</span><span class="score-chip">危険度 ${post.lvl}（${post.name}）</span></div></div>`;
  });
  pages.push(p3 + '</div>');

  let p4 = `<div class="page-title">④ 本日の安全目標</div><div class="page-content">`;
  list.forEach((h,idx)=>{ p4 += `<div class="goal-card">【危険ポイント${idx+1}】${escHtml(h.goal)}</div>`; });
  pages.push(p4 + '</div>');

  let p5 = `<div class="page-title">⑤ 指差呼称</div><div class="page-content">`;

function stepFinalHtml(){
  return `
    <div class="carousel" style="box-shadow:none;padding:0;min-height:auto;">
      <div id="finalPagesContainer"></div>
      <div class="nav-row">
        <button class="nav-btn" id="finalPrevBtn" onclick="finalNav(-1)">◀ 前へ</button>
        <div class="step-dots" id="finalDots" style="margin:0;"></div>
        <button class="nav-btn" id="finalNextBtn" onclick="finalNav(1)">次へ ▶</button>
      </div>
    </div>
    <button class="gen-btn save-btn" id="saveRecordBtn" style="margin-top:14px;">この内容で保存する</button>
  `;
}

function renderFinal(){
  const pages = buildPages(state.basic, adoptedList(), state.kun1, state.kun2, state.word1, state.word2);
  const container = document.getElementById('finalPagesContainer');
  container.innerHTML = pages.map((p,idx)=>`<div class="page ${idx===0?'active':''}" id="fpage${idx}">${p}</div>`).join('');
  document.getElementById('finalDots').innerHTML = pages.map((_,idx)=>`<div class="step-dot ${idx===0?'active':''}" id="fdot${idx}"></div>`).join('');
  finalTotal = pages.length;
  finalPage = 0;
  updateFinalNav();
}

function finalNav(dir){
  const next = finalPage + dir;
  if(next<0 || next>=finalTotal) return;
  document.getElementById('fpage'+finalPage).classList.remove('active');
  document.getElementById('fdot'+finalPage).classList.remove('active');
  finalPage = next;
  document.getElementById('fpage'+finalPage).classList.add('active');
  document.getElementById('fdot'+finalPage).classList.add('active');
  updateFinalNav();
}

function updateFinalNav(){
  document.getElementById('finalPrevBtn').disabled = finalPage===0;
  document.getElementById('finalNextBtn').disabled = finalPage===finalTotal-1;
}

function bindFinal(){
  renderFinal();
  document.getElementById('saveRecordBtn').addEventListener('click', saveCurrentRecord);
}

function saveCurrentRecord(){
  const records = loadRecords();
  const data = {
    basic: state.basic,
    candidates: state.candidates,
    kun1: state.kun1, kun2: state.kun2,
    word1: state.word1, word2: state.word2
  };
  const nowIso = new Date().toISOString();
  if(state.recordId){
    const rec = records.find(r=>r.id===state.recordId);
    if(rec){
      rec.data = data;
      rec.updatedAt = nowIso;
      rec.date = state.basic.dateIso;
    } else {
      records.push({ id: state.recordId, date: state.basic.dateIso, createdAt: nowIso, updatedAt: nowIso, data });
    }
  } else {
    records.push({ id: uid(), date: state.basic.dateIso, createdAt: nowIso, updatedAt: nowIso, data });
  }
  saveRecords(records);
  clearDraft();
  clearTimeout(saveTimer);
  alert('保存しました。');
  state = null;
  showScreen('home');
  refreshHome();
}

/* ---- ステップごとのイベントバインド ---- */
function bindStepEvents(step){
  if(step===1) bindBasic();
  if(step===2) bindCandidates();
  if(step===3) bindEdit();
  if(step===4) bindGoal();
  if(step===5) bindPointing();
  if(step===6) bindFinal();
}

/* =========================================================================
   保存済み一覧
   ========================================================================= */
function renderSavedList(){
  const records = loadRecords().slice().sort((a,b)=> (b.updatedAt||b.createdAt).localeCompare(a.updatedAt||a.createdAt));
  const body = document.getElementById('savedListBody');
  if(records.length===0){
    body.innerHTML = '<div class="empty-note">保存済みのKY活動表はまだありません。</div>';
    return;
  }
  body.innerHTML = records.map(r=>{
    const list = (r.data.candidates||[]).filter(c=>c.adopted);
    return `
      <div class="saved-item">
        <div class="date">${formatDateJP(r.date)}</div>
        <div class="meta">${escHtml(r.data.basic.work||'')}／危険ポイント${list.length}件</div>
        <div class="saved-actions">
          <button onclick="openRecord('${r.id}')">開く</button>
          <button onclick="editRecord('${r.id}')">編集する</button>
          <button onclick="duplicateRecord('${r.id}')">複製する</button>
          <button class="danger" onclick="deleteRecord('${r.id}')">削除</button>
        </div>
      </div>`;
  }).join('');
}

function findRecord(id){ return loadRecords().find(r=>r.id===id); }

function openRecord(id){
  const rec = findRecord(id);
  if(!rec) return;
  const pages = buildPages(rec.data.basic, (rec.data.candidates||[]).filter(c=>c.adopted), rec.data.kun1, rec.data.kun2, rec.data.word1, rec.data.word2);
  const container = document.getElementById('viewPagesContainer');
  container.innerHTML = pages.map((p,idx)=>`<div class="page ${idx===0?'active':''}" id="vpage${idx}">${p}</div>`).join('');
  document.getElementById('viewDots').innerHTML = pages.map((_,idx)=>`<div class="step-dot ${idx===0?'active':''}" id="vdot${idx}"></div>`).join('');
  window._viewTotal = pages.length;
  window._viewPage = 0;
  document.getElementById('viewPrevBtn').disabled = true;
  document.getElementById('viewNextBtn').disabled = pages.length<=1;
  showScreen('view');
}

function viewNavPage(dir){
  const next = window._viewPage + dir;
  if(next<0 || next>=window._viewTotal) return;
  document.getElementById('vpage'+window._viewPage).classList.remove('active');
  document.getElementById('vdot'+window._viewPage).classList.remove('active');
  window._viewPage = next;
  document.getElementById('vpage'+window._viewPage).classList.add('active');
  document.getElementById('vdot'+window._viewPage).classList.add('active');
  document.getElementById('viewPrevBtn').disabled = window._viewPage===0;
  document.getElementById('viewNextBtn').disabled = window._viewPage===window._viewTotal-1;
}

function editRecord(id){
  const rec = findRecord(id);
  if(!rec) return;
  if(loadDraft() && !confirm('現在の下書きは上書きされます。この保存済みKYを編集しますか？')) return;
  state = {
    recordId: rec.id,
    createdAt: rec.createdAt,
    step: 6,
    basic: rec.data.basic,
    candidates: rec.data.candidates,
    ackHighRisk: true,
    kun1: rec.data.kun1, kun2: rec.data.kun2,
    word1: rec.data.word1, word2: rec.data.word2,
    updatedAt: null
  };
  goToCreate();
}

function duplicateRecord(id){
  const rec = findRecord(id);
  if(!rec) return;
  if(loadDraft() && !confirm('現在の下書きは上書きされます。この内容を複製して新規作成しますか？')) return;
  const cloned = JSON.parse(JSON.stringify(rec.data));
  cloned.candidates.forEach(c=> c.key = uid());
  cloned.basic.dateIso = isoFromDate(new Date());
  cloned.basic.work = KY_CONFIG.fixedWorkContent;
  state = {
    recordId: null,
    createdAt: null,
    step: 1,
    basic: cloned.basic,
    candidates: cloned.candidates,
    ackHighRisk: true,
    kun1: cloned.kun1, kun2: cloned.kun2,
    word1: cloned.word1, word2: cloned.word2,
    updatedAt: null
  };
  goToCreate();
}

function deleteRecord(id){
  const rec = findRecord(id);
  if(!rec) return;
  if(!confirm(`${formatDateJP(rec.date)} のKY活動表を削除します。この操作は元に戻せません。よろしいですか？`)) return;
  const records = loadRecords().filter(r=>r.id!==id);
  saveRecords(records);
  renderSavedList();
  refreshHome();
}

/* =========================================================================
   簡易エスケープ
   ========================================================================= */
function escHtml(str){
  return String(str==null?'':str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function escAttr(str){ return escHtml(str); }

/* =========================================================================
   初期化
   ========================================================================= */
window.addEventListener('DOMContentLoaded', ()=>{
  document.getElementById('subtitle').textContent = KY_CONFIG.subTitle;
  refreshHome();
  showScreen('home');
});

// 一覧画面を開くたびに再描画
const _origShowScreen = showScreen;
showScreen = function(name){
  _origShowScreen(name);
  if(name==='savedList') renderSavedList();
  if(name==='home') refreshHome();
};
</script>
</body>
